<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>updatedprototype</title>
<style>
:root{
  --bg:#eef5ff; --panel:#ffffff; --ink:#1c2333; --accent:#ff5da2;
  --accent2:#5b7cff; --accent3:#ffb84d; --accent4:#3ecf8e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#12172a; --panel:#1c2340; --ink:#eef2ff; }
}
:root[data-theme="dark"]{ --bg:#12172a; --panel:#1c2340; --ink:#eef2ff; }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
#scene{position:fixed;inset:0;}
#title{
  position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;
  text-align:center;color:var(--ink);font-weight:800;font-size:1.3rem;
  text-shadow:0 2px 8px rgba(0,0,0,.25); pointer-events:none;
}
#title span{font-size:.75rem;display:block;font-weight:500;opacity:.75;}
#hud{
  position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;
  padding:14px 10px calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top, rgba(0,0,0,.35), transparent);
  flex-wrap:wrap;
}
.stationBtn{
  border:none;border-radius:16px;padding:10px 16px;font-size:.95rem;font-weight:700;
  color:#fff;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);
  display:flex;align-items:center;gap:6px;
}
#panel{
  position:fixed;inset:0;background:var(--panel);color:var(--ink);
  transform:translateY(100%);transition:transform .35s ease;overflow-y:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));
}
#panel.open{transform:translateY(0);}
#panelHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
#panelHead h2{margin:0;font-size:1.4rem;}
#closeBtn{background:#eee;border:none;border-radius:50%;width:38px;height:38px;font-size:1.2rem;cursor:pointer;}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px;}
.tile{
  border-radius:14px;border:none;color:#fff;font-weight:800;font-size:1.4rem;
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;gap:2px;padding:4px;
}
.tile small{font-size:.6rem;font-weight:600;opacity:.9;text-align:center;}
.tile.block3d{
  box-shadow: 0 6px 0 rgba(0,0,0,.28), 0 9px 14px rgba(0,0,0,.3), inset 0 2px 4px rgba(255,255,255,.35);
  border-bottom:none; transform:translateY(0); transition:transform .1s, box-shadow .1s;
}
.tile.block3d:active{
  transform:translateY(4px);
  box-shadow: 0 2px 0 rgba(0,0,0,.28), 0 3px 6px rgba(0,0,0,.3), inset 0 2px 4px rgba(255,255,255,.35);
}
.letter3d{
  color:#fff;
  text-shadow:
    1px 1px 0 rgba(0,0,0,.22),
    2px 2px 0 rgba(0,0,0,.18),
    3px 3px 3px rgba(0,0,0,.28);
}
.tile.pic{font-size:1.1rem;}
#grid{grid-template-columns:repeat(auto-fill,minmax(72px,1fr));}
.shapeBox{width:44px;height:44px;background:#fff;}
.hint{font-size:.85rem;opacity:.7;margin:6px 0 16px;}
</style>
</head>
<body>
<div id="title">Wonderly AR<span>3D Pre-Primary Classroom · tap a station to begin</span></div>
<div id="scene"></div>
<div id="hud">
  <button class="stationBtn" style="background:var(--accent)" onclick="openStation('alphabet')">🔤 A–Z</button>
  <button class="stationBtn" style="background:var(--accent2)" onclick="openStation('numbers')">🔢 1–10</button>
  <button class="stationBtn" style="background:var(--accent3)" onclick="openStation('shapes')">🔺 Shapes</button>
  <button class="stationBtn" style="background:var(--accent4)" onclick="openStation('colors')">🎨 Colors</button>
</div>

<div id="panel">
  <div id="panelHead">
    <h2 id="panelTitle">Station</h2>
    <button id="closeBtn" onclick="closePanel()">✕</button>
  </div>
  <div class="hint" id="panelHint">Tap a tile — it will speak out loud.</div>
  <div id="grid"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

/* ---------- 3D classroom scene ---------- */
const container = document.getElementById('scene');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 3, 9);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.minDistance = 4; controls.maxDistance = 16;
controls.target.set(0,1.5,0);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(5,10,5); scene.add(sun);

// wall texture generator: pastel base + colorful bunting trim + polka dots
function wallTexture(bg, dot){
  const c = document.createElement('canvas'); c.width=512; c.height=512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = bg; ctx.fillRect(0,0,512,512);
  const bunt = ['#ff5da2','#5b7cff','#ffb84d','#3ecf8e','#9b6bff'];
  for(let x=0,i=0;x<512;x+=42,i++){
    ctx.fillStyle = bunt[i%bunt.length];
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+42,0); ctx.lineTo(x+21,42); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = dot;
  for(let y=90;y<512;y+=68){
    for(let x=((y/68|0)%2? 34:0); x<512; x+=68){
      ctx.beginPath(); ctx.arc(x,y,9,0,Math.PI*2); ctx.fill();
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(2,1);
  return tex;
}
function ceilingTexture(){
  const c = document.createElement('canvas'); c.width=512; c.height=512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#f4edff'; ctx.fillRect(0,0,512,512);
  ctx.fillStyle = '#ffe066';
  for(let i=0;i<30;i++){
    const x=Math.random()*512,y=Math.random()*512,s=6+Math.random()*8;
    ctx.save(); ctx.translate(x,y);
    ctx.beginPath();
    for(let p=0;p<5;p++){ ctx.lineTo(Math.cos((p*4*Math.PI)/5)*s, Math.sin((p*4*Math.PI)/5)*s); }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  return new THREE.CanvasTexture(c);
}
function chalkboardTexture(){
  const c = document.createElement('canvas'); c.width=512; c.height=320;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#2f6b4f'; ctx.fillRect(0,0,512,320);
  ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 16; ctx.strokeRect(8,8,496,304);
  ctx.fillStyle = '#fdfdfd'; ctx.textAlign = 'center'; ctx.font = 'bold 84px sans-serif';
  ctx.fillText('ABC 123', 256, 150);
  ctx.font = '46px sans-serif';
  ctx.fillText('★ ▲ ● ■', 256, 235);
  return new THREE.CanvasTexture(c);
}

const loader = new THREE.TextureLoader();

const matNX = new THREE.MeshStandardMaterial({map: loader.load(imgNX), side:THREE.BackSide});

function rugTexture(){
  const c = document.createElement('canvas'); c.width=1024; c.height=1024;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fdf6ec'; ctx.fillRect(0,0,1024,1024);
  // outer rug border
  ctx.strokeStyle = '#e8c07d'; ctx.lineWidth = 30;
  ctx.strokeRect(40,40,944,944);
  ctx.strokeStyle = '#ff9fc7'; ctx.lineWidth = 10;
  ctx.strokeRect(80,80,864,864);
  // grid of colorful number circles
  const cols = ['#ff5da2','#5b7cff','#ffb84d','#3ecf8e','#9b6bff','#ff8a5c'];
  const cell = 176, startX = 128, startY = 128;
  let n = 1;
  for(let row=0; row<5; row++){
    for(let col=0; col<5; col++){
      const cx = startX + col*cell, cy = startY + row*cell;
      ctx.fillStyle = cols[(row+col)%cols.length];
      ctx.beginPath(); ctx.arc(cx,cy,68,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 64px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(String(n<=20?n:''), cx, cy+4);
      n++;
    }
  }
  return new THREE.CanvasTexture(c);
}
// floor
const floor = new THREE.Mesh(new THREE.PlaneGeometry(16,16), new THREE.MeshStandardMaterial({map: rugTexture()}));
floor.rotation.x = -Math.PI/2; scene.add(floor);

// classroom "toy" decorations
const palette = [0xff5da2,0x5b7cff,0xffb84d,0x3ecf8e,0xffe066,0x9b6bff];
const paletteCSS = ['#ff5da2','#5b7cff','#ffb84d','#3ecf8e','#ffcc00','#9b6bff'];
function rnd(a,b){return a+Math.random()*(b-a);}
const shapesGeo = [
  ()=>new THREE.BoxGeometry(0.8,0.8,0.8),
  ()=>new THREE.SphereGeometry(0.5,16,16),
  ()=>new THREE.ConeGeometry(0.5,0.9,16),
  ()=>new THREE.TorusGeometry(0.4,0.15,12,24)
];
const floaters = [];
for(let i=0;i<14;i++){
  const geo = shapesGeo[i%shapesGeo.length]();
  const mat = new THREE.MeshStandardMaterial({color: palette[i%palette.length]});
  const m = new THREE.Mesh(geo, mat);
  m.position.set(rnd(-5,5), rnd(1,6), rnd(-5,5));
  m.userData.speed = rnd(0.3,0.9);
  m.userData.offset = Math.random()*Math.PI*2;
  scene.add(m); floaters.push(m);
}

function animate(t){
  requestAnimationFrame(animate);
  floaters.forEach(m=>{
    m.rotation.x += 0.005; m.rotation.y += 0.008;
    m.position.y += Math.sin(t*0.001*m.userData.speed + m.userData.offset)*0.002;
  });
  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------- learning content ---------- */
function speak(text){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.85; u.pitch = 1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}

const alphabet = [
  ['A','Apple','🍎'],['B','Ball','⚽'],['C','Cat','🐱'],['D','Dog','🐶'],['E','Elephant','🐘'],['F','Fish','🐟'],
  ['G','Goat','🐐'],['H','Hat','🎩'],['I','Ice cream','🍦'],['J','Jug','🏺'],['K','Kite','🪁'],['L','Lion','🦁'],
  ['M','Moon','🌙'],['N','Nest','🪺'],['O','Orange','🍊'],['P','Pig','🐷'],['Q','Queen','👸'],['R','Rabbit','🐰'],
  ['S','Sun','☀️'],['T','Tiger','🐯'],['U','Umbrella','☂️'],['V','Van','🚐'],['W','Watch','⌚'],['X','Xylophone','🎼'],
  ['Y','Yak','🐃'],['Z','Zebra','🦓']
];
const numbers = Array.from({length:10},(_,i)=>i+1);
const numberColors = ['#e74c3c','#3498db','#f1c40f','#2ecc71','#e67e22','#9b59b6','#ff5da2','#1abc9c','#8b5a2b','#34495e'];
const shapes = [
  ['Circle','50%','#e74c3c'],['Square','4px','#3498db'],['Triangle',null,'#f1c40f'],
  ['Rectangle','6px','#2ecc71'],['Star',null,'#9b59b6'],['Oval','50%','#ff5da2']
];
const colors = [
  ['Red','#e74c3c'],['Blue','#3498db'],['Yellow','#f1c40f'],['Green','#2ecc71'],
  ['Orange','#e67e22'],['Purple','#9b59b6'],['Pink','#ff5da2'],['Brown','#8b5a2b'],
  ['Black','#2c2c2c'],['White','#f4f4f4']
];

const panel = document.getElementById('panel');
const grid = document.getElementById('grid');
const panelTitle = document.getElementById('panelTitle');
const panelHint = document.getElementById('panelHint');

function openStation(kind){
  grid.innerHTML = '';
  panel.classList.add('open');
  if(kind==='alphabet'){
    panelTitle.textContent = 'Alphabet A–Z';
    panelHint.textContent = 'Tap a letter to hear it and its word.';
    alphabet.forEach(([l,w,emoji],i)=>{
      const b = document.createElement('button');
      b.className='tile pic block3d'; b.style.background = paletteCSS[i%paletteCSS.length];
      b.innerHTML = `<div style="font-size:1.6rem;line-height:1;">${emoji}</div><span class="letter3d">${l}</span><small>${w}</small>`;
      b.onclick = ()=>speak(`${l}. ${w}`);
      grid.appendChild(b);
    });
  } else if(kind==='numbers'){
    panelTitle.textContent = 'Numbers 1–10';
    panelHint.textContent = 'Tap a number to hear it counted.';
    numbers.forEach((n,i)=>{
      const b = document.createElement('button');
      b.className='tile'; b.style.background = numberColors[i];
      b.innerHTML = `${n}<small>${'●'.repeat(n).slice(0,10)}</small>`;
      b.onclick = ()=>speak(`Number ${n}`);
      grid.appendChild(b);
    });
  } else if(kind==='shapes'){
    panelTitle.textContent = 'Shapes';
    panelHint.textContent = 'Tap a shape to hear its name.';
    shapes.forEach(([name,radius,color])=>{
      const b = document.createElement('button');
      b.className='tile'; b.style.background = '#f2f4f8'; b.style.color = '#333';
      let shapeHTML;
      if(name==='Triangle'){
        shapeHTML = `<div style="width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-bottom:38px solid ${color};"></div>`;
      } else if(name==='Star'){
        shapeHTML = `<div style="font-size:2rem;color:${color};">★</div>`;
      } else {
        shapeHTML = `<div class="shapeBox" style="background:${color};border-radius:${radius};${name==='Rectangle'?'width:60px;height:36px;':''}${name==='Oval'?'width:60px;height:36px;':''}"></div>`;
      }
      b.innerHTML = shapeHTML + `<small>${name}</small>`;
      b.onclick = ()=>speak(name);
      grid.appendChild(b);
    });
  } else if(kind==='colors'){
    panelTitle.textContent = 'Colors';
    panelHint.textContent = 'Tap a color to hear its name and paint the classroom walls.';
    colors.forEach(([name,hex])=>{
      const b = document.createElement('button');
      b.className='tile'; b.style.background = hex;
      b.style.color = (name==='White'||name==='Yellow') ? '#333':'#fff';
      b.innerHTML = `<small>${name}</small>`;
      b.onclick = ()=>{ speak(name); window.wallMats.forEach(m=>m.color.set(hex)); };
      grid.appendChild(b);
    });
  }
}
function closePanel(){ panel.classList.remove('open'); }
